name: Install December 2026 English flipbook pages
on:
  push:
    branches:
      - feature/december-2026-english-flipbook
    paths:
      - 'OCEANS_December_2026_English_Flipbook_Assets*.zip'
      - '.github/workflows/install-december-2026-flipbook.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and verify December flipbook pages
        run: |
          set -euo pipefail
          archive="$(find . -maxdepth 1 -type f -name 'OCEANS_December_2026_English_Flipbook_Assets*.zip' | head -n 1)"
          test -n "$archive"
          unzip -q -o "$archive" -d .
          test -s public/covers/december-2026-en.webp
          for n in $(seq -w 1 146); do
            name="$(printf '%03d' "$((10#$n))")"
            test -s "public/december-en/$name.webp"
          done
          test "$(find public/december-en -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 146
          rm "$archive"
      - name: Commit and publish installed pages to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/december-en public/covers/december-2026-en.webp
          git add -u -- 'OCEANS_December_2026_English_Flipbook_Assets*.zip'
          git commit -m "assets: install 146 December 2026 English flipbook pages and cover"
          git push
