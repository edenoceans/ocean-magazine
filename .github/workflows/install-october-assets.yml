name: Install OCEANS October page assets
on:
  push:
    branches: [feature/landing-flyer-update-oct-2026]
    paths:
      - OCEANS-October-EN-Pages.zip
      - OCEANS-October-FR-Pages.zip
      - .github/workflows/install-october-assets.yml
permissions:
  contents: write
jobs:
  install-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unpack October English and French pages and flyer
        run: |
          unzip -q -o OCEANS-October-EN-Pages.zip -d .
          unzip -q -o OCEANS-October-FR-Pages.zip -d .
          test -f public/october-en/001.webp
          test -f public/october-en/133.webp
          test -f public/october-fr/001.webp
          test -f public/october-fr/133.webp
          test -f public/oceans-landing-flyer.jpg
          test "$(find public/october-en -name '*.webp' | wc -l)" -eq 133
          test "$(find public/october-fr -name '*.webp' | wc -l)" -eq 133
          rm OCEANS-October-EN-Pages.zip OCEANS-October-FR-Pages.zip
      - name: Commit installed page images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/october-en public/october-fr public/oceans-landing-flyer.jpg
          git add -u OCEANS-October-EN-Pages.zip OCEANS-October-FR-Pages.zip
          git commit -m "assets: install October EN and FR flipbooks and flyer"
          git push
