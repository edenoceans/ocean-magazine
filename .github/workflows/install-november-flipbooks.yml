name: Install November English and French flipbook pages
on:
  push:
    branches: [feature/november-2026-flipbooks]
    paths:
      - OCEANS-November-EN-Flipbook-Pages.zip
      - OCEANS-November-FR-Flipbook-Pages.zip
      - .github/workflows/install-november-flipbooks.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and validate page images
        run: |
          set -eu
          test -f OCEANS-November-EN-Flipbook-Pages.zip
          test -f OCEANS-November-FR-Flipbook-Pages.zip
          unzip -q -o OCEANS-November-EN-Flipbook-Pages.zip
          unzip -q -o OCEANS-November-FR-Flipbook-Pages.zip
          test "$(find public/november-en -name '*.webp' | wc -l)" -eq 142
          test "$(find public/november-fr -name '*.webp' | wc -l)" -eq 142
          test -s public/november-en/001.webp
          test -s public/november-en/142.webp
          test -s public/november-fr/001.webp
          test -s public/november-fr/142.webp
          rm OCEANS-November-EN-Flipbook-Pages.zip OCEANS-November-FR-Flipbook-Pages.zip
      - name: Commit installed pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/november-en public/november-fr
          git add -u OCEANS-November-EN-Flipbook-Pages.zip OCEANS-November-FR-Flipbook-Pages.zip
          git commit -m 'assets: install November 142-page EN and FR flipbooks'
          git push
